# Checks the BOM FTP feed twice a day and records warnings starting and ending.
#
# Commit author: set repository variables GIT_AUTHOR_NAME and GIT_AUTHOR_EMAIL.
# GIT_AUTHOR_EMAIL should be the repo owner's GitHub noreply address,
# ID+username@users.noreply.github.com (find it with
#   gh api user --jq '"\(.id)+\(.login)@users.noreply.github.com"'
# ). If unset, the owner's login and noreply address are used.
name: Update warnings

on:
  schedule:
    - cron: "17 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-warnings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure git author
        env:
          NAME: ${{ vars.GIT_AUTHOR_NAME || github.repository_owner }}
          EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || format('{0}+{1}@users.noreply.github.com', github.repository_owner_id, github.repository_owner) }}
        run: |
          git config user.name "$NAME"
          git config user.email "$EMAIL"

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Fetch warnings and record start/end events
        run: python3 bom_alerts.py --commit

      - name: Push
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$(git log --oneline "origin/$BRANCH..HEAD")" ]; then
            git pull --rebase --quiet origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          else
            echo "Nothing to push"
          fi
